name: Something else
description: Anything that isn't a bug report or a compatibility report
title: "[Other]: "
body:
  - type: input
    id: distribution
    attributes:
      label: Distribution
      placeholder: Nobara 44
  - type: input
    id: runtime
    attributes:
      label: OpenXR runtime
      placeholder: SteamVR
  - type: input
    id: somnilux-version
    attributes:
      label: Somnilux version
      placeholder: 3.0 Beta 1
  - type: textarea
    id: issue
    attributes:
      label: What's on your mind?
    validations:
      required: true
